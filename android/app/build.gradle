apply plugin: 'com.android.application'

def releaseKeystorePropertiesFile = rootProject.file('keystore.properties')
def releaseKeystoreProperties = new Properties()
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile.withInputStream { releaseKeystoreProperties.load(it) }
}
// Codemagic supplies the uploaded keystore without writing passwords to the repo.
def codemagicBuild = System.getenv('CM_BUILD_ID') != null
if (codemagicBuild) {
    ['storeFile': 'CM_KEYSTORE_PATH', 'storePassword': 'CM_KEYSTORE_PASSWORD',
     'keyAlias': 'CM_KEY_ALIAS', 'keyPassword': 'CM_KEY_PASSWORD'].each { key, envName ->
        releaseKeystoreProperties[key] = System.getenv(envName) ?: ''
    }
}

android {
    namespace = "com.pilateacher.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pilateacher.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 70
        versionName "1.1.43"
        if (codemagicBuild) {
            def ciCode = System.getenv('ANDROID_VERSION_CODE')
            if (!ciCode || !(ciCode ==~ /[1-9][0-9]*/) || ciCode.toLong() > 2100000000L) {
                throw new GradleException('ANDROID_VERSION_CODE must be a valid Play version code.')
            }
            versionCode ciCode.toInteger()
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (codemagicBuild || releaseKeystorePropertiesFile.exists()) {
                storeFile file(releaseKeystoreProperties['storeFile'])
                storePassword releaseKeystoreProperties['storePassword']
                keyAlias releaseKeystoreProperties['keyAlias']
                keyPassword releaseKeystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { task -> task.name.toLowerCase().contains('release') }) {
        def requiredKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        if ((!codemagicBuild && !releaseKeystorePropertiesFile.exists()) || requiredKeys.any { key -> !releaseKeystoreProperties[key]?.toString()?.trim() }) {
            throw new GradleException('android/keystore.properties must contain all release signing values.')
        }
        if (!file(releaseKeystoreProperties['storeFile']).exists()) {
            throw new GradleException('The configured release keystore file does not exist.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
