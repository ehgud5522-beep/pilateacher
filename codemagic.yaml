workflows:
  ios-testflight:
    name: Pilateacher iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: false

    # 회원 앱만 바뀐 커밋에서는 돌지 않는다.
    #
    # 빼는 쪽으로 적는 이유가 있다. 넣는 쪽(includes)으로 적으면 경로 하나를
    # 빠뜨렸을 때 **강사 앱이 조용히 안 만들어진다** -- 릴리스 날에 그것을
    # 알게 된다. 빼는 쪽으로 적으면 빠뜨렸을 때 쓸데없이 한 번 더 도는 것이
    # 전부다. 틀리는 방향을 고른 것이다.
    #
    # 수동 빌드에는 적용되지 않는다 (Codemagic 은 changeset 을 웹훅 빌드에만
    # 본다). 브랜치를 골라 직접 돌리면 언제나 돈다.
    when:
      changeset:
        includes:
          - '.'
        excludes:
          - 'member/'
          - 'member-app/'

    integrations:
      app_store_connect: 필라티쳐

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pilateacher.app
      groups:
        - signing
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.pilateacher.app"
        VITE_AI_ENABLED: "true"
        VITE_AI_PROVIDER: "openai"
        VITE_AI_GATEWAY_URL: "https://asia-northeast3-pilateacher.cloudfunctions.net/aiGateway/v1/ai/execute"

    scripts:
      - name: Install npm packages
        script: npm install

      - name: Prepare build metadata
        script: python3 tools/ios/prepare_build_metadata.py

      - name: Build web
        script: npm run build

      - name: Capacitor sync ios
        script: npx cap sync ios

      - name: Validate iOS launch resources
        script: |
          set -euo pipefail
          test -f ios/App/App/public/index.html
          test -f ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/App.entitlements
          grep -q "GoogleService-Info.plist in Resources" ios/App/App.xcodeproj/project.pbxproj
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" ios/App/App.xcodeproj/project.pbxproj
          grep -q "com.apple.SignInWithApple" ios/App/App.xcodeproj/project.pbxproj
          grep -q "NSMicrophoneUsageDescription" ios/App/App/Info.plist
          grep -q "CFBundleURLSchemes" ios/App/App/Info.plist
          test ! -e ios/App/App/cert_key.pem
          python3 tools/ios/validate_release_source.py

      - name: Install pods if needed
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install
          else
            echo "Podfile not found - using Swift Package Manager, skipping"
          fi

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Validate applied code signing
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import glob
          import hashlib
          import os
          import plistlib
          import subprocess
          import sys

          expected_bundle_id = "com.pilateacher.app"
          expected_team_id = "7ADRYNV3B4"
          export_options_path = os.path.expanduser("~/export_options.plist")

          def fail(message):
              print(f"Code signing validation failed: {message}", file=sys.stderr)
              sys.exit(1)

          if not os.path.isfile(export_options_path):
              fail(f"{export_options_path} was not created by xcode-project use-profiles")

          with open(export_options_path, "rb") as export_options_file:
              export_options = plistlib.load(export_options_file)

          profile_reference = (export_options.get("provisioningProfiles") or {}).get(
              expected_bundle_id
          )
          export_method = export_options.get("method")
          export_team_id = export_options.get("teamID")
          signing_certificate = str(export_options.get("signingCertificate") or "")

          if not profile_reference:
              fail(f"no provisioning profile is assigned to {expected_bundle_id}")
          if export_method not in {"app-store", "app-store-connect"}:
              fail(f"unexpected export method: {export_method!r}")
          if export_team_id is not None and export_team_id != expected_team_id:
              fail(f"unexpected Team ID: {export_team_id!r}")
          if signing_certificate and "Apple Distribution" not in signing_certificate:
              fail(f"unexpected signing certificate: {signing_certificate!r}")

          profile_paths = []
          for profile_directory in (
              "~/Library/MobileDevice/Provisioning Profiles",
              "~/Library/Developer/Xcode/UserData/Provisioning Profiles",
          ):
              profile_paths.extend(
                  glob.glob(os.path.expanduser(f"{profile_directory}/*.mobileprovision"))
              )

          selected_profile = None
          for profile_path in profile_paths:
              try:
                  decoded_profile = subprocess.check_output(
                      ["security", "cms", "-D", "-i", profile_path],
                      stderr=subprocess.DEVNULL,
                  )
                  profile = plistlib.loads(decoded_profile)
              except (OSError, subprocess.CalledProcessError, plistlib.InvalidFileException):
                  continue

              if profile_reference in {profile.get("Name"), profile.get("UUID")}:
                  selected_profile = profile
                  break

          if selected_profile is None:
              fail(f"the applied profile {profile_reference!r} is not installed")

          profile_name = selected_profile.get("Name")
          profile_uuid = selected_profile.get("UUID")
          profile_team_ids = selected_profile.get("TeamIdentifier") or []
          profile_entitlements = selected_profile.get("Entitlements") or {}
          application_identifier = (
              profile_entitlements.get("application-identifier")
              or profile_entitlements.get("com.apple.application-identifier")
          )
          expiration_date = selected_profile.get("ExpirationDate")
          apple_sign_in = profile_entitlements.get("com.apple.developer.applesignin") or []

          if expected_team_id not in profile_team_ids:
              fail(f"profile Team ID does not include {expected_team_id}")
          if application_identifier != f"{expected_team_id}.{expected_bundle_id}":
              fail(f"unexpected application identifier: {application_identifier!r}")
          if not isinstance(expiration_date, datetime.datetime):
              fail("profile expiration date is missing")
          if expiration_date.tzinfo is None:
              expiration_date = expiration_date.replace(tzinfo=datetime.timezone.utc)
          if expiration_date <= datetime.datetime.now(datetime.timezone.utc):
              fail(f"profile expired at {expiration_date.isoformat()}")
          if selected_profile.get("ProvisionedDevices"):
              fail("a development or ad hoc profile was selected")
          if selected_profile.get("ProvisionsAllDevices"):
              fail("an enterprise profile was selected")
          if profile_entitlements.get("get-task-allow") is not False:
              fail("profile is not configured for App Store distribution")
          if "Default" not in apple_sign_in:
              fail("Sign in with Apple entitlement is missing")

          profile_certificate_fingerprints = {
              hashlib.sha1(bytes(certificate)).hexdigest().upper()
              for certificate in selected_profile.get("DeveloperCertificates") or []
          }
          try:
              identities = subprocess.check_output(
                  ["security", "find-identity", "-v", "-p", "codesigning"],
                  text=True,
                  stderr=subprocess.STDOUT,
              )
          except (OSError, subprocess.CalledProcessError) as error:
              fail(f"could not inspect installed signing identities: {error}")

          matching_identity = next(
              (
                  line.strip()
                  for line in identities.splitlines()
                  if "Apple Distribution" in line
                  and any(
                      fingerprint in line
                      for fingerprint in profile_certificate_fingerprints
                  )
              ),
              None,
          )
          if matching_identity is None:
              fail("the profile's Apple Distribution identity is not installed")

          print(f"Provisioning profile name: {profile_name}")
          print(f"Profile UUID: {profile_uuid}")
          print(f"Bundle ID: {expected_bundle_id}")
          print(f"Team ID: {expected_team_id}")
          print("Distribution type: app_store")
          print("Sign in with Apple entitlement: included")
          print("Apple Distribution certificate: applied")
          print(f"Provisioning profile expiration: {expiration_date.isoformat()}")
          PY

      # 스토어의 빌드 번호는 여기서 정해진다. 저장소의 CURRENT_PROJECT_VERSION 은
      # 이 줄이 덮어쓰므로 올려도 효과가 없고, 올려 두면 저장소(2)와 스토어(118대)가
      # 어긋나 보여 다음 사람이 어느 쪽을 믿어야 할지 알 수 없다. 그래서 저장소
      # 값은 자리표시자로 두고 건드리지 않는다.
      # 올리는 것은 MARKETING_VERSION 하나뿐이다 (ios/App/App.xcodeproj).
      - name: Set build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build ipa
        script: |
          cd $CM_BUILD_DIR
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "$XCODE_SCHEME"
          fi

      - name: Validate exported IPA, archive, and dSYM
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 tools/ios/validate_release_artifacts.py

          ARCHIVE_PATH="$(cat build/ios/metadata/archive-path.txt)"
          rm build/ios/metadata/archive-path.txt
          mkdir -p build/ios/archive build/ios/dsyms build/ios/logs
          ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE_PATH" "build/ios/archive/App-${BUILD_NUMBER}.xcarchive.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE_PATH/dSYMs" "build/ios/dsyms/App-${BUILD_NUMBER}-dSYMs.zip"
          if [ -d /tmp/xcodebuild_logs ]; then
            find /tmp/xcodebuild_logs -maxdepth 1 -type f -name '*.log' -exec cp {} build/ios/logs/ \;
          fi
          test -s "build/ios/archive/App-${BUILD_NUMBER}.xcarchive.zip"
          test -s "build/ios/dsyms/App-${BUILD_NUMBER}-dSYMs.zip"
          test -s build/ios/metadata/build-info.json
          echo "Archive artifact: build/ios/archive/App-${BUILD_NUMBER}.xcarchive.zip"
          echo "dSYM artifact: build/ios/dsyms/App-${BUILD_NUMBER}-dSYMs.zip"
          echo "Build info artifact: build/ios/metadata/build-info.json"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive.zip
      - build/ios/dsyms/*.zip
      - build/ios/logs/*.log
      - build/ios/metadata/build-info.json
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # 올리기만 한다. 베타 심사에 넣지 않는다.
        #
        # 내부 테스터는 처리가 끝나면 바로 설치할 수 있다 -- 베타 심사는
        # 외부 테스터에게만 필요하다. 심사를 넣으면 한 트레인에 한 번뿐이라
        # 같은 버전으로 두 번째 빌드를 올리는 순간 422 로 막힌다:
        #
        #   Another build in the same train is already in beta review.
        #
        # 그러면 업로드는 멀쩡히 끝났는데 빌드가 빨갛게 끝나고, 다음 사람은
        # 올라가지 않았다고 읽는다. 실제로 그랬다.
        submit_to_testflight: false
        # submit_to_app_store 는 false 로 둔다. 스토어 제출은 사람이 누른다.
        submit_to_app_store: false
        # beta_groups 를 두지 않는다. 여기 적혀 있던 'Internal' 은 App Store
        # Connect 에 없는 이름이었고, 매 빌드마다 조용히 실패하고 있었다.
        # 외부 배포를 시작할 때 실제 그룹 이름을 확인해서 넣는다.

  # ── 회원 앱 ───────────────────────────────────────────────────────────────
  # 강사 앱과 **같은 저장소, 다른 번들**이다. 섞이면 회원이 강사 앱 화면을
  # 받거나 그 반대가 되는데, 둘 다 스토어에 올라간 뒤에야 드러난다.
  #
  # 가르는 자리가 넷이다.
  #   트리거 : 위 워크플로는 member/ · member-app/ 을 빼고, 이쪽은 그것만 본다
  #   번들   : com.bonitapilates.member
  #   경로   : member-app/ios/App (루트의 ios/ 를 열지 않는다)
  #   동기화 : npm run member:sync -- cap 을 member-app 안에서만 부른다
  member-ios-testflight:
    name: Bonita Member iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: false

    # 회원 앱과 관계있는 것이 바뀌었을 때만 돈다.
    #
    # 여기는 넣는 쪽으로 적는다. 빠뜨렸을 때 안 도는 것이 전부이고, 그때는
    # Codemagic 화면에서 브랜치를 골라 직접 돌리면 된다. 회원 앱은 아직
    # 릴리스 일정이 없어 그 실패가 싸다.
    #
    # src/features/ui/ 가 있는 것은 회원 화면이 거기 type-scale.js 를 읽기
    # 때문이다. 지금 두 앱이 공유하는 코드는 그 하나뿐이다.
    when:
      changeset:
        includes:
          - 'member/'
          - 'member-app/'
          - 'src/features/ui/'
          - 'tools/member/'
          - 'package.json'
          - 'package-lock.json'
          - 'codemagic.yaml'

    integrations:
      app_store_connect: 필라티쳐

    environment:
      node: 22
      xcode: latest
      # CocoaPods 를 쓰지 않는다. Capacitor 8 이 만든 이 프로젝트는 SPM 이고
      # (CapApp-SPM/Package.swift) Podfile 이 없다.
      #
      # **ios_signing 을 두지 않는다.** 그 블록은 Codemagic 이 스크립트보다
      # 먼저 도는 자동 서명을 켜는데, 회원 앱은 아직 프로비저닝 프로필이
      # 없어서 그 단계가 빌드를 통째로 세운다 -- 내 스크립트는 시작도 못
      # 한다. 서명은 'Set up code signing' 에서 직접 받아 온다.
      groups:
        - signing
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bonitapilates.member"

    scripts:
      - name: Install npm packages
        script: npm install

      - name: 회원 앱을 만들고 있는지 먼저 본다
        script: |
          set -euo pipefail
          # 이름이 비슷한 두 워크플로가 있으면 언젠가 설정이 섞인다. 그때
          # 나오는 것은 잘못된 빌드가 아니라 **맞는 것처럼 보이는** 빌드다.
          test "$BUNDLE_ID" = "com.bonitapilates.member"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.bonitapilates.member;" member-app/ios/App/App.xcodeproj/project.pbxproj
          node -e "const c=require('./member-app/capacitor.config.json');if(c.appId!=='com.bonitapilates.member')process.exit(1)"

      - name: Build member web and sync ios
        # 웹 빌드(typecheck · lint · 전체 테스트 포함)와 cap sync 를 함께 한다.
        # cap 은 member-app 안에서만 돈다 -- 루트에서 부르면 강사 앱의 ios/ 를
        # 건드린다 (tools/member/sync.mjs).
        script: npm run member:sync

      - name: Validate member iOS launch resources
        script: |
          set -euo pipefail
          test -f member-app/ios/App/App/public/index.html
          test -f member-app/ios/App/App/GoogleService-Info.plist
          plutil -lint member-app/ios/App/App/Info.plist
          plutil -lint member-app/ios/App/App/GoogleService-Info.plist
          plutil -lint member-app/ios/App/App/App.entitlements

          # 파일이 폴더에 있는 것과 번들에 들어가는 것은 다르다. 이것이
          # 빠지면 Firebase 가 초기화되지 않고, 문자 인증은 "실패" 가 아니라
          # 아무 일도 안 일어남으로 끝난다.
          grep -q "GoogleService-Info.plist in Resources" member-app/ios/App/App.xcodeproj/project.pbxproj

          # 무음 푸시로 전화 인증을 끝내는 권한. 없으면 조용히 reCAPTCHA 로
          # 되돌아간다 -- 고장으로 보이지 않아서 빠진 줄 모른다.
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" member-app/ios/App/App.xcodeproj/project.pbxproj
          grep -q "aps-environment" member-app/ios/App/App/App.entitlements

          # APNs 가 안 될 때 reCAPTCHA 가 앱으로 돌아오는 길.
          grep -q "app-1-452402660812-ios-" member-app/ios/App/App/Info.plist

          # 설정 파일이 회원 앱 것인가. 콘솔에서 내려받으면 두 앱 파일 이름이
          # 같아서 섞인다.
          plutil -extract BUNDLE_ID raw member-app/ios/App/App/GoogleService-Info.plist | grep -qx "com.bonitapilates.member"

          # 강사 앱을 건드리지 않았는가. cap 이 잘못된 폴더에서 돌면 여기가
          # 바뀐다.
          test -z "$(git status --porcelain ios/ android/)"

      - name: Set up code signing
        # 강사 앱과 다른 길이다. 그쪽은 environment.ios_signing 의 Codemagic
        # 자동 서명에 맡기는데, **그것은 이미 있는 프로필을 가져올 뿐 만들지
        # 않는다.** 강사 앱 프로필은 예전에 만들어져 있었고 회원 앱은 없어서
        # 첫 빌드가 이렇게 끝났다:
        #
        #   No matching profiles found for bundle identifier
        #   com.bonitapilates.member and distribution type app_store
        #
        # 그 실패는 스크립트가 돌기 전에 난다. 그래서 이 워크플로는
        # environment.ios_signing 을 두지 않고 여기서 직접 받아 온다 --
        # --create 가 없으면 만들지 않는다.
        #
        # **인증서는 새로 만들지 않는다.** 배포 인증서는 계정당 개수 제한이
        # 있고, 한 칸을 태우면 되돌리려면 다른 것을 폐기해야 한다. 기존
        # 인증서를 다시 쓰려면 그 개인키가 있어야 하므로, 없으면 여기서
        # 멈춘다 -- 조용히 새로 만드는 것보다 낫다.
        script: |
          set -euo pipefail

          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY 가 없습니다." >&2
            echo "" >&2
            echo "이 값이 있어야 강사 앱과 **같은 배포 인증서**를 다시 씁니다." >&2
            echo "없이 진행하면 인증서를 새로 만드는데, 배포 인증서는 계정당" >&2
            echo "개수 제한이 있어 한 칸을 태우게 됩니다." >&2
            echo "" >&2
            echo "Codemagic → Teams → (팀) → Environment variables 에서" >&2
            echo "'signing' 그룹에 CERTIFICATE_PRIVATE_KEY 를 넣으세요" >&2
            echo "(Secure 체크). 값은 기존 배포 인증서의 .p12 개인키입니다." >&2
            exit 1
          fi

          # 인증서가 늘었는지 세어 본다. **이 세기 자체가 빌드를 죽이면 안
          # 된다** -- CLI 출력 형식이 바뀌면 서명과 상관없는 이유로 빌드가
          # 멈춘다. 못 세면 못 셌다고 말하고 넘어간다. 진짜 방벽은 위의
          # CERTIFICATE_PRIVATE_KEY 검사다.
          count_certs() {
            app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null \
              | python3 -c "import json,sys;print(len(json.load(sys.stdin)))" 2>/dev/null || echo ""
          }
          BEFORE="$(count_certs)"
          echo "배포 인증서 (전): ${BEFORE:-셀 수 없음}"

          keychain initialize

          # --create 는 **프로필**을 만들기 위한 것이다. 인증서는
          # --certificate-key 로 기존 것을 찾아 쓴다.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

          AFTER="$(count_certs)"
          echo "배포 인증서 (후): ${AFTER:-셀 수 없음}"
          if [ -n "$BEFORE" ] && [ -n "$AFTER" ] && [ "$AFTER" -gt "$BEFORE" ]; then
            echo "배포 인증서가 새로 만들어졌습니다 ($BEFORE -> $AFTER)." >&2
            echo "CERTIFICATE_PRIVATE_KEY 가 기존 인증서와 짝이 맞지 않습니다." >&2
            echo "Apple Developer -> Certificates 에서 남는 것을 폐기하고," >&2
            echo "맞는 개인키를 넣은 뒤 다시 돌리세요." >&2
            exit 1
          fi

          keychain add-certificates
          xcode-project use-profiles

      - name: Validate applied code signing
        script: |
          set -euo pipefail
          python3 tools/member/validate_signing.py

      - name: Set build number
        # 저장소의 CURRENT_PROJECT_VERSION 은 자리표시자다. 이 줄이 덮어쓰므로
        # 올려도 효과가 없다. 올리는 것은 MARKETING_VERSION 하나뿐이다.
        #
        # BUILD_NUMBER 는 이 Codemagic 앱의 빌드 번호라 강사 앱과 한 통에서
        # 센다. 회원 앱 쪽 번호가 듬성듬성해지지만 언제나 늘기만 한다 --
        # App Store Connect 가 요구하는 것은 그것뿐이다.
        script: |
          cd $CM_BUILD_DIR/member-app/ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build ipa
        # workspace 가 없다. CocoaPods 를 쓰지 않으므로 .xcodeproj 를 직접
        # 연다 (SPM 의존성은 xcodebuild 가 푼다).
        script: |
          cd $CM_BUILD_DIR
          xcode-project build-ipa --project "member-app/ios/App/App.xcodeproj" --scheme "$XCODE_SCHEME"

      - name: Validate exported IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          IPA="$(ls build/ios/ipa/*.ipa | head -1)"
          test -s "$IPA"
          unzip -o -q "$IPA" -d /tmp/member-ipa
          APP="$(ls -d /tmp/member-ipa/Payload/*.app | head -1)"
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist" | grep -qx "com.bonitapilates.member"
          test -f "$APP/GoogleService-Info.plist"
          # aps-environment 가 실제로 서명에 들어갔는가. 저장소에는
          # development 로 적혀 있고 배포 아카이브에서 production 이 된다 --
          # 그 치환이 일어났는지는 여기서만 알 수 있다.
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "aps-environment"
          echo "IPA: $IPA"
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist"
          plutil -extract CFBundleVersion raw "$APP/Info.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # 강사 앱과 같다. 올리기만 하고 베타 심사에 넣지 않는다 -- 내부
        # 테스터는 처리가 끝나면 바로 설치할 수 있고, 심사는 한 트레인에
        # 한 번뿐이라 같은 버전의 두 번째 빌드가 422 로 막힌다.
        submit_to_testflight: false
        submit_to_app_store: false
        # beta_groups 를 적지 않는다. 여기 이름을 박아 두면 App Store Connect
        # 쪽 이름과 다를 때 매 빌드가 조용히 실패한다 -- 강사 앱에서
        # 'Internal' 로 실제로 그랬고, 그 이름의 그룹은 없었다. 내부 그룹에는
        # App Store Connect 의 "자동으로 새 빌드 배포" 로 보낸다.

  # ── 회원 앱 Android ─────────────────────────────────────────────────────
  # AAB(Play 업로드용) 과 APK(폰에 직접 깔아 보는 용)를 만든다. **올리지는
  # 않는다** -- Play 업로드는 대표가 한다 (CLAUDE.md: 스토어 업로드는 지시가
  # 있을 때만).
  #
  # 트리거가 없다 = **수동 실행만.** Codemagic 화면에서 브랜치를 골라 누른다.
  # 위 두 iOS 워크플로는 main push 로 돌지만 이것은 돌지 않는다 -- 자동 배포는
  # 나중에 정한다.
  #
  # 서명과 Firebase 설정은 저장소에 없다. 전부 그룹 bonita_member_signing 에서
  # 온다. **sign-ing 이다** -- 강사 앱 때 그룹 이름을 singing 으로 적어 아홉 번
  # 실패했다. 이름이 틀리면 Codemagic 은 그룹을 못 찾았다고 말하지 않고, 변수가
  # 비어 있는 채로 빌드가 시작된다. 그래서 첫 단계가 변수부터 본다.
  member-android:
    name: Bonita Member Android (AAB + APK)
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      node: 22
      java: 21
      groups:
        - bonita_member_signing
      vars:
        PACKAGE_NAME: "com.bonitapilates.member"

    scripts:
      - name: 서명 · Firebase 변수가 다 있는지 먼저 본다
        script: |
          set -euo pipefail
          missing=""
          for name in MEMBER_KEYSTORE_BASE64 MEMBER_KEYSTORE_PASSWORD MEMBER_KEY_ALIAS MEMBER_KEY_PASSWORD MEMBER_GOOGLE_SERVICES_JSON; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "[MEMBER_SIGNING_VARS_MISSING] 비어 있는 변수:$missing"
            echo "  그룹 이름이 bonita_member_signing 인지(singing 아님), 변수가 그 그룹에 있는지 보세요."
            exit 1
          fi
          # 별칭이 회원 앱 키인가. 강사 앱 키를 올리면 여기서 걸린다.
          test "$MEMBER_KEY_ALIAS" = "bonita-member-upload" || {
            echo "[WRONG_KEY_ALIAS] 별칭이 bonita-member-upload 가 아닙니다."; exit 1; }

      - name: Install npm packages
        script: npm ci

      - name: 회원 앱을 만들고 있는지 본다
        script: |
          set -euo pipefail
          test "$PACKAGE_NAME" = "com.bonitapilates.member"
          grep -q 'applicationId "com.bonitapilates.member"' member-app/android/app/build.gradle
          node -e "const c=require('./member-app/capacitor.config.json');if(c.appId!=='com.bonitapilates.member')process.exit(1)"

      - name: google-services.json 을 놓고 회원 앱 것인지 본다
        # 저장소에 없다. Gradle 은 이 파일이 없으면 **경고만 남기고 Firebase
        # 없이 빌드한다** -- 그 앱은 열리고, 문자 인증만 안 된다.
        script: |
          set -euo pipefail
          echo "$MEMBER_GOOGLE_SERVICES_JSON" | base64 --decode > member-app/android/app/google-services.json
          node tools/member/google-services.mjs

      - name: 업로드 키를 놓는다
        # 키와 비밀번호는 빌드 폴더 밖에 두고, 로그에 찍지 않는다.
        script: |
          set -euo pipefail
          KEYSTORE="$HOME/bonita-member-upload.keystore"
          echo "$MEMBER_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          {
            echo "storeFile=$KEYSTORE"
            echo "storePassword=$MEMBER_KEYSTORE_PASSWORD"
            echo "keyAlias=$MEMBER_KEY_ALIAS"
            echo "keyPassword=$MEMBER_KEY_PASSWORD"
          } > member-app/android/keystore.properties
          chmod 600 "$KEYSTORE" member-app/android/keystore.properties

      - name: Build member web and sync android
        # 웹 빌드(typecheck · lint · 전체 테스트 포함)와 cap sync. cap 은
        # member-app 안에서만 돈다 (tools/member/sync.mjs).
        script: |
          set -euo pipefail
          npm run member:sync
          # 강사 앱을 건드리지 않았는가.
          test -z "$(git status --porcelain android/ ios/)"

      - name: AAB 와 APK
        # versionCode 는 이 워크플로의 빌드 번호다 -- Play 는 같은 번호를 두 번
        # 받지 않는다. 손으로 올리는 번호는 올리는 것을 잊은 날 조용히 틀린다.
        script: |
          set -euo pipefail
          cd member-app/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --console=plain \
            -PmemberVersionCode="$BUILD_NUMBER"

      - name: 서명과 번호를 확인한다
        script: |
          set -euo pipefail
          AAB=member-app/android/app/build/outputs/bundle/release/app-release.aab
          APK=member-app/android/app/build/outputs/apk/release/app-release.apk
          test -s "$AAB"
          test -s "$APK"
          # 회원 앱 업로드 키로 서명됐는가 (tools/member/upload-key.mjs 의 지문).
          keytool -printcert -jarfile "$AAB" > /tmp/aab-cert.txt
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { checkUploadSignature } from './tools/member/upload-key.mjs';
            const result = checkUploadSignature(readFileSync('/tmp/aab-cert.txt', 'utf8'));
            console.log('AAB 서명 SHA1:', result.found || '(없음)');
            if (!result.ok) { console.error('[' + result.code + '] 회원 앱 업로드 키가 아닙니다.'); process.exit(1); }
          "
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q "package: name='com.bonitapilates.member' versionCode='$BUILD_NUMBER'"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i "SHA-1"

      - name: 남은 비밀을 걷는다
        script: |
          rm -f "$HOME/bonita-member-upload.keystore" member-app/android/keystore.properties member-app/android/app/google-services.json

    artifacts:
      - member-app/android/app/build/outputs/bundle/release/*.aab
      - member-app/android/app/build/outputs/apk/release/*.apk
      - member-app/android/app/build/outputs/mapping/release/mapping.txt
