<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 두 모드 각각의 주소창 색. 한 값만 두면 다크에서 흰 띠가 남는다. -->
    <meta name="theme-color" content="#FFF7FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161214" media="(prefers-color-scheme: dark)" />
    <!-- 본문 글꼴 하나(Pretendard)만 받는다. 2026-10-30 개편으로 세리프 제목을
         굵은 고딕으로 바꿔 구글 폰트(Gowun Batang)는 더 받지 않는다. -->
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <meta name="description" content="보니따필라테스 회원권 잔여와 수업 기록" />
    <!-- 아이콘은 member-app/resources/icon-source.png 하나에서 나온다
         (node member-app/scripts/make-icons.mjs). 앱 아이콘과 같은 그림이다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>보니따필라테스 — 내 회원권</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
